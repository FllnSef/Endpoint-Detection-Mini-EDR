# EDR Rules Configuration
# Format: RULE_NAME | CATEGORY | TYPE | PATTERN | ACTION
# Actions: alert, kill, quarantine

Detect_NC_ReverseShell       | process | cmdline_match     | -e /bin/               | kill
Detect_DevTcp_ReverseShell   | process | cmdline_match     | /dev/tcp/              | kill
Detect_Python_PTY            | process | cmdline_match     | pty.spawn              | kill
Detect_Webshell_Spawn        | process | cmdline_match     | webshell_activity      | kill
Detect_Download_Pipe         | process | cmdline_match     | | bash                 | kill
Detect_Shadow_Access         | process | cmdline_match     | /etc/shadow            | alert
Detect_SUID_Abuse            | process | cmdline_match     | chmod +s               | alert
Detect_AntiForensics_LogWipe | process | cmdline_match     | history -c             | alert
Detect_TempDir_Execution     | process | path_match        | /tmp/                  | quarantine
Detect_DevShm_Execution      | process | path_match        | /dev/shm/              | quarantine
Detect_Yara_Malware          | process | yara_match        | Detect_Test_Malware    | kill
Detect_Cron_Persistence      | file    | persistence_match | /etc/cron              | alert
Detect_Systemd_Persistence   | file    | persistence_match | /etc/systemd/system    | alert
Detect_SSH_Backdoor          | file    | persistence_match | authorized_keys        | alert
Detect_Linker_Hijack         | file    | persistence_match | /etc/ld.so.preload     | alert
